<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disponibilidad de Oficinas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/favicon-arrow.png">
    <style>
  :root {
    --black: #000000;
    --dark: #212121;
    --light-gray: #e1e1e1;
    --off-white: #ededed;
    --white: #ffffff;
    --brand: #394B86;
    --chip-dark: #2f2f2f;
    --danger: #c44;
    --success: #5b7d00;
    --border: rgba(255,255,255,0.08);
    --shadow-soft: 0 8px 20px rgba(0,0,0,.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(180deg, #1a1a1a 0%, #212121 100%);
    color: var(--white);
  }

  .app {
    max-width: 1450px;
    margin: 0 auto;
    padding: 28px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 24px;
  }

  .title {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  .subtitle {
    color: var(--light-gray);
    font-size: 14px;
    margin: 0;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .button {
    background: var(--brand);
    color: var(--white);
    border: none;
    border-radius: 14px;
    padding: 12px 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .button.secondary {
    background: transparent;
    color: var(--white);
    border: 1px solid #555;
  }

  .week-nav {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
  }

  .week-label {
    font-size: 16px;
    font-weight: 600;
    color: var(--white);
    min-width: 240px;
  }

  .grid {
    display: grid;
    grid-template-columns: 220px repeat(5, 1fr);
    gap: 12px;
    align-items: stretch;
  }

  .grid-head,
  .office-name,
  .cell {
    border-radius: 20px;
    padding: 16px;
  }

  .grid-head {
    background: var(--brand);
    color: var(--white);
    text-align: center;
    font-weight: 700;
    min-height: 74px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
  }

  .grid-head .day-name {
    font-size: 16px;
    line-height: 1.1;
  }

  .grid-head .date {
    font-size: 12px;
    opacity: 0.8;
  }

  .office-name {
    background: linear-gradient(180deg, #171717 0%, #1f1f1f 100%);
    border: 1px solid var(--border);
    color: var(--white);
    font-weight: 700;
    display: flex;
    align-items: center;
    min-height: 185px;
    font-size: 17px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    box-shadow: var(--shadow-soft);
    padding: 22px 18px;
  }

  .office-name span {
    display: block;
    max-width: 140px;
  }

  .office-inline {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.office-flag {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(255,255,255,.12);
}

.office-label {
  display: inline-block;
}

  .cell {
    background: var(--off-white);
    color: var(--black);
    min-height: 185px;
    position: relative;
    border: 1px solid rgba(0,0,0,.06);
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-soft);
    transition: transform .18s ease, box-shadow .18s ease;
    padding: 18px;
  }

  .cell.free {
    border-color: var(--brand);
  }

  .cell.partial {
    border-color: #999;
  }

  .cell.full {
    background: #d8d8d8;
    border-color: #b8b8b8;
  }

  .status {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .status.free { color: var(--success); }
  .status.partial { color: #555; }
  .status.full { color: var(--danger); }

  .booking-chip {
    background: linear-gradient(180deg, #262626 0%, #212121 100%);
    color: var(--white);
    border-radius: 18px;
    padding: 14px 15px;
    font-size: 12px;
    line-height: 1.45;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.04),
      0 8px 18px rgba(0,0,0,.16);
  }


  .booking-chip-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }

  .booking-delete {
    background: transparent;
    color: rgba(255,255,255,.75);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }

  .delete-booking-btn {
  margin-top: 10px;
  background: transparent;
  color: #ffb3b3;
  border: 1px solid rgba(255, 179, 179, .45);
  border-radius: 999px;
  padding: 7px 10px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.delete-booking-btn:hover {
  background: rgba(255, 179, 179, .12);
}

  .booking-delete:hover {
    background: rgba(255,255,255,.08);
    color: #fff;
    border-color: rgba(255,255,255,.35);
  }

  .booking-delete:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  .booking-chip strong {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .booking-meta {
    display: block;
    font-size: 12px;
    opacity: 0.86;
  }

  .booking-person {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    font-weight: 500;
    opacity: 0.96;
  }

  .cell-actions {
    margin-top: auto;
    display: flex;
    justify-content: flex-end;
  }

  .cell-button {
    background: var(--brand);
    color: var(--white);
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    box-shadow: 0 8px 18px rgba(57,75,134,.22);
  }

  .message {
    margin: 14px 0 20px;
    padding: 14px 16px;
    border-radius: 14px;
    display: none;
    font-size: 14px;
    font-weight: 500;
  }

  .message.show { display: block; }

  .message.success {
    background: rgba(57,75,134,.12);
    color: #dbe2ff;
    border: 1px solid rgba(57,75,134,.35);
  }

  .message.error {
    background: rgba(255,90,90,.1);
    color: #ffb3b3;
    border: 1px solid rgba(255,90,90,.3);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
  }

  .modal-backdrop.show {
    display: flex;
  }

  .modal {
    width: 100%;
    max-width: 520px;
    background: var(--dark);
    color: var(--white);
    border-radius: 24px;
    padding: 24px;
    border: 1px solid #444;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }

  .modal h3 {
    margin: 0 0 6px;
    font-size: 24px;
  }

  .modal p {
    margin: 0 0 18px;
    color: var(--light-gray);
    font-size: 14px;
  }

  .form-grid {
    display: grid;
    gap: 14px;
  }

  .field {
    display: grid;
    gap: 8px;
  }

  .field label {
    font-size: 13px;
    font-weight: 600;
  }

  .field input,
  .field select {
    width: 100%;
    background: #2a2a2a;
    color: var(--white);
    border: 1px solid #555;
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 1100px) {
    .grid {
      display: block;
    }

    .office-name,
#oficinaNombre {
  font-family: 'Montserrat', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
}

    .grid-head,
    .office-name,
    .cell {
      margin-bottom: 10px;
      min-height: auto;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1 class="title">Disponibilidad de oficinas</h1>
        <p class="subtitle">Visualización semanal y reservas internas</p>
      </div>
      <div class="toolbar">
        <button class="button secondary" id="prevWeekBtn">Semana anterior</button>
        <button class="button secondary" id="nextWeekBtn">Semana siguiente</button>
      </div>
    </div>

    <div class="week-nav">
      <div class="week-label" id="weekLabel">Cargando semana...</div>
    </div>

    <div class="message" id="messageBox"></div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>Nueva reserva</h3>
      <p id="modalMeta">Completá los datos para reservar este espacio.</p>

      <form id="reservationForm" class="form-grid">

        <div class="field">
          <label>Tipo de reserva</label>
          <select id="tipoReserva" required>
            <option value="completo">Día completo</option>
            <option value="horario">Horario específico</option>
          </select>
        </div>

        <div id="horarioFields" class="hidden">
          <div class="field">
            <label>Hora inicio</label>
            <input type="time" id="horaInicio" />
          </div>

          <div class="field">
            <label>Hora fin</label>
            <input type="time" id="horaFin" />
          </div>
        </div>

        <div class="field">
          <label>Equipo</label>
          <input type="text" id="equipo" required />
        </div>

        <div class="field">
          <label>Nombre</label>
          <input type="text" id="nombre" required />
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>

        <div class="modal-actions">
          <button type="button" class="button secondary" id="cancelBtn">Cancelar</button>
          <button type="submit" class="button">Confirmar reserva</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwJMYUw4ag5wQvth6RRCzd5yAivRiMQ_pvRoKL0usNB1KM5L3xKqbzuM62x2s0UYB3U/exec';

  let currentWeekStart = getMonday(new Date());
  let currentData = null;
  let selectedSlot = null;
  let isSubmitting = false;
  const OWNER_TOKEN_KEY = 'office_booking_owner_token';

  function getOwnerToken() {
    let token = localStorage.getItem(OWNER_TOKEN_KEY);

    if (!token) {
      token = 'owner_' + crypto.randomUUID();
      localStorage.setItem(OWNER_TOKEN_KEY, token);
    }

    return token;
  }


  const grid = document.getElementById('grid');
  const weekLabel = document.getElementById('weekLabel');
  const messageBox = document.getElementById('messageBox');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const reservationForm = document.getElementById('reservationForm');
  const tipoReserva = document.getElementById('tipoReserva');
  const horarioFields = document.getElementById('horarioFields');

  document.getElementById('prevWeekBtn').addEventListener('click', () => {
    currentWeekStart.setDate(currentWeekStart.getDate() - 7);
    loadWeek();
  });

  document.getElementById('nextWeekBtn').addEventListener('click', () => {
    currentWeekStart.setDate(currentWeekStart.getDate() + 7);
    loadWeek();
  });

  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  tipoReserva.addEventListener('change', () => {
    horarioFields.classList.toggle('hidden', tipoReserva.value !== 'horario');
  });

  reservationForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (isSubmitting) return;
    if (!selectedSlot) return;

    isSubmitting = true;

    const submitBtn = reservationForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Procesando...';

    const payload = {
      action: 'reserve',
      oficina_id: selectedSlot.oficinaId,
      fecha: selectedSlot.date,
      tipo: document.getElementById('tipoReserva').value,
      hora_inicio: document.getElementById('horaInicio').value,
      hora_fin: document.getElementById('horaFin').value,
      equipo: document.getElementById('equipo').value.trim(),
      nombre: document.getElementById('nombre').value.trim(),
      email: document.getElementById('email').value.trim(),
      owner_token: getOwnerToken()
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const json = await res.json();

      if (!json.ok) {
        showMessage(json.message || 'No se pudo crear la reserva.', 'error');
        return;
      }

      closeModal();
      alert('Reserva creada con éxito. Refrescá la página para verla completada.');
window.location.reload();
      await loadWeek();
    } catch (error) {
      console.error(error);
      showMessage('Ocurrió un error al guardar la reserva.', 'error');
    } finally {
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirmar reserva';
    }
  });

  function getMonday(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function formatDateISO(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatDateDisplay(dateStr) {
    const [year, month, day] = dateStr.split('-');
    return `${day}/${month}/${year}`;
  }

  function formatHour(value) {
  if (!value) return '';

  let str = String(value).trim();

  if (str.startsWith("'")) {
    str = str.slice(1);
  }

  const match = str.match(/(\d{1,2}):(\d{2})/);

  if (!match) return str;

  let h = Number(match[1]);
  let m = Number(match[2]);

  if (m % 10 === 9) {
    m += 1;
  }

  if (m >= 60) {
    h += 1;
    m = 0;
  }

  if (h >= 24) {
    h = 0;
  }

  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

  function formatOfficeText(id, nombre) {
    const map = {
      'us': 'Estados Unidos',
      'ar': 'Argentina',
      'co': 'Colombia',
      'pr': 'Puerto Rico',
      'ca': 'Canadá',
      'es': 'España',
      'uy': 'Uruguay',
      'oi': 'Ofi Interna',
      'pb': 'Ofi PB'
    };

    return map[String(id).trim().toLowerCase()] || nombre;
  }

  function setWeekLabel(weekDates) {
    const first = weekDates[0]?.date;
    const last = weekDates[weekDates.length - 1]?.date;
    weekLabel.textContent = `Semana del ${formatDateDisplay(first)} al ${formatDateDisplay(last)}`;
  }

  async function loadWeek() {
    const weekStart = formatDateISO(currentWeekStart);

    try {
      const res = await fetch(`${API_URL}?action=week&weekStart=${weekStart}`);
      const json = await res.json();

      currentData = json;
      setWeekLabel(json.weekDates);
      renderGrid(json);
    } catch (error) {
      console.error(error);
      showMessage('No se pudo cargar la disponibilidad.', 'error');
    }
  }

 function renderGrid(data) {
  const { oficinas, weekDates, reservas } = data;
  let html = '';

  html += `<div class="grid-head"></div>`;

  function formatOfficeName(id, nombre) {
    const map = {
      'us': { flag: 'https://flagcdn.com/us.svg', label: 'Estados Unidos' },
      'ar': { flag: 'https://flagcdn.com/ar.svg', label: 'Argentina' },
      'co': { flag: 'https://flagcdn.com/co.svg', label: 'Colombia' },
      'pr': { flag: 'https://flagcdn.com/pr.svg', label: 'Puerto Rico' },
      'ca': { flag: 'https://flagcdn.com/ca.svg', label: 'Canadá' },
      'es': { flag: 'https://flagcdn.com/es.svg', label: 'España' },
      'uy': { flag: 'https://flagcdn.com/uy.svg', label: 'Uruguay' }
    };

    const item = map[String(id).trim().toLowerCase()];
    if (!item) return nombre;

    return `
      <span class="office-inline">
        <img class="office-flag" src="${item.flag}" alt="${item.label}">
        <span class="office-label">${item.label}</span>
      </span>
    `;
  }

  weekDates.forEach(day => {
    html += `<div class="grid-head">
      <div class="day-name">${day.label}</div>
      <div class="date">${formatDateDisplay(day.date)}</div>
    </div>`;
  });

  oficinas.forEach(oficina => {
    html += `<div class="office-name">${formatOfficeName(oficina.id, oficina.nombre)}</div>`;

    weekDates.forEach(day => {
      const reservasDia = reservas.filter(r =>
        String(r.oficina_id).trim().toLowerCase() === String(oficina.id).trim().toLowerCase() &&
        String(r.fecha).trim() === String(day.date).trim()
      );

      let statusClass = 'free';
      let statusText = 'Libre';

      if (reservasDia.some(r => r.tipo === 'completo')) {
        statusClass = 'full';
        statusText = 'Ocupación completa';
      } else if (reservasDia.length > 0) {
        statusClass = 'partial';
        statusText = 'Ocupación parcial';
      }

      html += `<div class="cell ${statusClass}">`;
      html += `<div class="status ${statusClass}">${statusText}</div>`;

      if (reservasDia.length === 0) {
        html += `<div class="cell-actions">
          <button class="cell-button" onclick="openReservationModal('${oficina.id}','${oficina.nombre}','${day.date}')">Reservar</button>
        </div>`;
      } else {
        reservasDia.forEach(r => {
          const isOwnReservation = String(r.owner_token || '').trim() === getOwnerToken();

          html += `<div class="booking-chip">
            <strong>${r.equipo || 'Reserva'}</strong>
            <span class="booking-meta">
              ${r.tipo === 'completo'
                ? 'Día completo'
                : `${formatHour(r.hora_inicio)} – ${formatHour(r.hora_fin)}`
              }
            </span>
            <span class="booking-person">${r.nombre || ''}</span>
<button class="delete-booking-btn" onclick="cancelReservation('${r.id}')">Cancelar reserva</button>
          </div>`;
        });

        const hasFullDay = reservasDia.some(r => r.tipo === 'completo');

        if (!hasFullDay) {
          html += `<div class="cell-actions">
            <button class="cell-button" onclick="openReservationModal('${oficina.id}','${oficina.nombre}','${day.date}')">Agregar horario</button>
          </div>`;
        }
      }

      html += `</div>`;
    });
  });

  grid.innerHTML = html;
}

async function cancelReservation(reservationId) {
  if (!reservationId) return;

  const email = window.prompt('Ingresá el email con el que se creó esta reserva para poder cancelarla.');

  if (!email) return;

  const confirmDelete = window.confirm('¿Querés cancelar esta reserva?');

  if (!confirmDelete) return;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'cancel',
        id: reservationId,
        email: email.trim().toLowerCase()
      })
    });

    const json = await res.json();

    if (!json.ok) {
      alert(json.message || 'No se pudo cancelar la reserva.');
      return;
    }

    alert('Reserva cancelada con éxito. La página se actualizará.');
    window.location.reload();
  } catch (error) {
    console.error(error);
    alert('Ocurrió un error al cancelar la reserva.');
  }
}

window.cancelReservation = cancelReservation;

  function openReservationModal(oficinaId, oficinaNombre, date) {
    selectedSlot = { oficinaId, oficinaNombre, date };

    document.getElementById('modalMeta').textContent = `Reservá ${oficinaNombre} para el ${formatDateDisplay(date)}.`;

    reservationForm.reset();
    document.getElementById('tipoReserva').value = 'completo';
    horarioFields.classList.add('hidden');
    modalBackdrop.classList.add('show');
  }

  function closeModal() {
    selectedSlot = null;
    modalBackdrop.classList.remove('show');
  }

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = `message show ${type}`;
    setTimeout(() => {
      messageBox.className = 'message';
    }, 4500);
  }


window.cancelReservation = cancelReservation;

  loadWeek();

  window.openReservationModal = openReservationModal;
  window.cancelReservation = cancelReservation;
</script>
</body>
</html>
