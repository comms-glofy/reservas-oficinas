<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disponibilidad de Oficinas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000000;
      --dark: #212121;
      --light-gray: #e1e1e1;
      --off-white: #ededed;
      --white: #ffffff;
      --brand: #CEFF00;
      --chip-dark: #2f2f2f;
      --danger: #c44;
      --success: #5b7d00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(180deg, #1a1a1a 0%, #212121 100%);
      color: var(--white);
    }

    .app {
      max-width: 1450px;
      margin: 0 auto;
      padding: 28px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 24px;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .subtitle {
      color: var(--light-gray);
      font-size: 14px;
      margin: 0;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .button {
      background: var(--brand);
      color: var(--black);
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .button.secondary {
      background: transparent;
      color: var(--white);
      border: 1px solid #555;
    }

    .week-nav {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .week-label {
      font-size: 16px;
      font-weight: 600;
      color: var(--white);
      min-width: 240px;
    }

    .grid {
      display: grid;
      grid-template-columns: 220px repeat(5, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .grid-head,
    .office-name,
    .cell {
      border-radius: 20px;
      padding: 16px;
    }

    .grid-head {
      background: var(--brand);
      color: var(--black);
      text-align: center;
      font-weight: 700;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .office-name {
      background: #1b1b1b;
      border: 1px solid #444;
      color: var(--white);
      font-weight: 700;
      display: flex;
      align-items: center;
      min-height: 170px;
    }

    .cell {
      background: var(--off-white);
      color: var(--black);
      min-height: 170px;
      position: relative;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cell.free {
      border-color: var(--brand);
    }

    .cell.partial {
      border-color: #999;
    }

    .cell.full {
      background: #d8d8d8;
      border-color: #b8b8b8;
    }

    .status {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .status.free { color: var(--success); }
    .status.partial { color: #555; }
    .status.full { color: var(--danger); }

    .booking-chip {
      background: var(--dark);
      color: var(--white);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.35;
    }

    .booking-chip strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .cell-actions {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
    }

    .cell-button {
      background: var(--brand);
      color: var(--black);
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }

    .message {
      margin: 14px 0 20px;
      padding: 14px 16px;
      border-radius: 14px;
      display: none;
      font-size: 14px;
      font-weight: 500;
    }

    .message.show { display: block; }
    .message.success {
      background: rgba(206,255,0,.12);
      color: #dfff7a;
      border: 1px solid rgba(206,255,0,.35);
    }
    .message.error {
      background: rgba(255,90,90,.1);
      color: #ffb3b3;
      border: 1px solid rgba(255,90,90,.3);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      background: var(--dark);
      color: var(--white);
      border-radius: 24px;
      padding: 24px;
      border: 1px solid #444;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .modal h3 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .modal p {
      margin: 0 0 18px;
      color: var(--light-gray);
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
    }

    .field input,
    .field select {
      width: 100%;
      background: #2a2a2a;
      color: var(--white);
      border: 1px solid #555;
      border-radius: 12px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1100px) {
      .grid {
        display: block;
      }
      .grid-head,
      .office-name,
      .cell {
        margin-bottom: 10px;
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1 class="title">Disponibilidad de oficinas</h1>
        <p class="subtitle">Visualización semanal y reservas internas</p>
      </div>
      <div class="toolbar">
        <button class="button secondary" id="prevWeekBtn">Semana anterior</button>
        <button class="button secondary" id="nextWeekBtn">Semana siguiente</button>
      </div>
    </div>

    <div class="week-nav">
      <div class="week-label" id="weekLabel">Cargando semana...</div>
    </div>

    <div class="message" id="messageBox"></div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>Nueva reserva</h3>
      <p id="modalMeta">Completá los datos para reservar este espacio.</p>

      <form id="reservationForm" class="form-grid">
        <div class="field">
          <label>Oficina</label>
          <input type="text" id="oficinaNombre" disabled />
        </div>

        <div class="field">
          <label>Fecha</label>
          <input type="text" id="fechaReservaVisible" disabled />
        </div>

        <div class="field">
          <label>Tipo de reserva</label>
          <select id="tipoReserva" required>
            <option value="completo">Día completo</option>
            <option value="horario">Horario específico</option>
          </select>
        </div>

        <div id="horarioFields" class="hidden">
          <div class="field">
            <label>Hora inicio</label>
            <input type="time" id="horaInicio" />
          </div>

          <div class="field">
            <label>Hora fin</label>
            <input type="time" id="horaFin" />
          </div>
        </div>

        <div class="field">
          <label>Equipo</label>
          <input type="text" id="equipo" required />
        </div>

        <div class="field">
          <label>Nombre</label>
          <input type="text" id="nombre" required />
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>

        <div class="modal-actions">
          <button type="button" class="button secondary" id="cancelBtn">Cancelar</button>
          <button type="submit" class="button">Confirmar reserva</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwJMYUw4ag5wQvth6RRCzd5yAivRiMQ_pvRoKL0usNB1KM5L3xKqbzuM62x2s0UYB3U/exec';

    let currentWeekStart = getMonday(new Date());
    let currentData = null;
    let selectedSlot = null;

    const grid = document.getElementById('grid');
    const weekLabel = document.getElementById('weekLabel');
    const messageBox = document.getElementById('messageBox');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const reservationForm = document.getElementById('reservationForm');
    const tipoReserva = document.getElementById('tipoReserva');
    const horarioFields = document.getElementById('horarioFields');

    document.getElementById('prevWeekBtn').addEventListener('click', () => {
      currentWeekStart.setDate(currentWeekStart.getDate() - 7);
      loadWeek();
    });

    document.getElementById('nextWeekBtn').addEventListener('click', () => {
      currentWeekStart.setDate(currentWeekStart.getDate() + 7);
      loadWeek();
    });

    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    tipoReserva.addEventListener('change', () => {
      horarioFields.classList.toggle('hidden', tipoReserva.value !== 'horario');
    });

    reservationForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!selectedSlot) return;

      const payload = {
        action: 'reserve',
        oficina_id: selectedSlot.oficinaId,
        fecha: selectedSlot.date,
        tipo: document.getElementById('tipoReserva').value,
        hora_inicio: document.getElementById('horaInicio').value,
        hora_fin: document.getElementById('horaFin').value,
        equipo: document.getElementById('equipo').value.trim(),
        nombre: document.getElementById('nombre').value.trim(),
        email: document.getElementById('email').value.trim()
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const json = await res.json();

        if (!json.ok) {
          showMessage(json.message || 'No se pudo crear la reserva.', 'error');
          return;
        }

        closeModal();
        showMessage('Reserva creada con éxito.', 'success');
        await loadWeek();
      } catch (error) {
        console.error(error);
        showMessage('Ocurrió un error al guardar la reserva.', 'error');
      }
    });

    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function formatDateISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateDisplay(dateStr) {
      const [year, month, day] = dateStr.split('-');
      return `${day}/${month}/${year}`;
    }

    function formatHour(value) {
      if (!value) return '';

      const str = String(value).trim();

      if (/^\d{2}:\d{2}$/.test(str)) {
        return str;
      }

      const date = new Date(str);
      if (!isNaN(date)) {
        const hh = String(date.getHours()).padStart(2, '0');
        const mm = String(date.getMinutes()).padStart(2, '0');
        return `${hh}:${mm}`;
      }

      return str;
    }

    function setWeekLabel(weekDates) {
      const first = weekDates[0]?.date;
      const last = weekDates[weekDates.length - 1]?.date;
      weekLabel.textContent = `Semana del ${formatDateDisplay(first)} al ${formatDateDisplay(last)}`;
    }

    async function loadWeek() {
      const weekStart = formatDateISO(currentWeekStart);

      try {
        const res = await fetch(`${API_URL}?action=week&weekStart=${weekStart}`);
        const json = await res.json();

        currentData = json;
        setWeekLabel(json.weekDates);
        renderGrid(json);
      } catch (error) {
        console.error(error);
        showMessage('No se pudo cargar la disponibilidad.', 'error');
      }
    }

    function renderGrid(data) {
      const { oficinas, weekDates, reservas } = data;
      let html = '';

      html += `<div class="grid-head"></div>`;
      weekDates.forEach(day => {
        html += `<div class="grid-head">${day.label}<br><small>${formatDateDisplay(day.date)}</small></div>`;
      });

      oficinas.forEach(oficina => {
        html += `<div class="office-name">${oficina.nombre}</div>`;

        weekDates.forEach(day => {
          const reservasDia = reservas.filter(r =>
            String(r.oficina_id).trim().toLowerCase() === String(oficina.id).trim().toLowerCase() &&
            String(r.fecha).trim() === String(day.date).trim()
          );

          let statusClass = 'free';
          let statusText = 'Libre';

          if (reservasDia.some(r => r.tipo === 'completo')) {
            statusClass = 'full';
            statusText = 'Ocupación completa';
          } else if (reservasDia.length > 0) {
            statusClass = 'partial';
            statusText = 'Ocupación parcial';
          }

          html += `<div class="cell ${statusClass}">`;
          html += `<div class="status ${statusClass}">${statusText}</div>`;

          if (reservasDia.length === 0) {
            html += `<div class="cell-actions">
              <button class="cell-button" onclick="openReservationModal('${oficina.id}','${oficina.nombre}','${day.date}')">Reservar</button>
            </div>`;
          } else {
            reservasDia.forEach(r => {
              html += `<div class="booking-chip">
                <strong>${r.equipo || 'Reserva'}</strong>
                ${r.tipo === 'completo'
                  ? 'Día completo'
                  : `${formatHour(r.hora_inicio)} – ${formatHour(r.hora_fin)}`
                }<br>
                ${r.nombre || ''}
              </div>`;
            });

            const hasFullDay = reservasDia.some(r => r.tipo === 'completo');
            if (!hasFullDay) {
              html += `<div class="cell-actions">
                <button class="cell-button" onclick="openReservationModal('${oficina.id}','${oficina.nombre}','${day.date}')">Agregar horario</button>
              </div>`;
            }
          }

          html += `</div>`;
        });
      });

      grid.innerHTML = html;
    }

    function openReservationModal(oficinaId, oficinaNombre, date) {
      selectedSlot = { oficinaId, oficinaNombre, date };

      document.getElementById('oficinaNombre').value = oficinaNombre;
      document.getElementById('fechaReservaVisible').value = formatDateDisplay(date);
      document.getElementById('modalMeta').textContent = `Reservá ${oficinaNombre} para el ${formatDateDisplay(date)}.`;

      reservationForm.reset();
      document.getElementById('tipoReserva').value = 'completo';
      horarioFields.classList.add('hidden');
      modalBackdrop.classList.add('show');
    }

    function closeModal() {
      selectedSlot = null;
      modalBackdrop.classList.remove('show');
    }

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message show ${type}`;
      setTimeout(() => {
        messageBox.className = 'message';
      }, 4500);
    }

    loadWeek();

    window.openReservationModal = openReservationModal;
  </script>
</body>
</html>
